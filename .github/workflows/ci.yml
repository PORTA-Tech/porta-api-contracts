name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  contracts-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porta-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: porta-contracts/package-lock.json
      - run: npm ci
      - run: npm run contracts:validate

  compatibility-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porta-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: porta-contracts/package-lock.json
      - run: npm ci
      - run: npm run contracts:compat

  client-generation-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porta-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: porta-contracts/package-lock.json
      - run: npm ci
      - run: npm run contracts:client-check

  schema-drift-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: porta-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: porta-contracts/package-lock.json
      - run: npm ci
      - run: npm run contracts:drift
